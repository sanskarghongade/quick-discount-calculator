<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Quick Discount Calculator">
  <defs>
    <linearGradient id="qdcBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece9ff"/>
    </linearGradient>

    <linearGradient id="qdcInk" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="48" y2="48">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>

    <filter id="qdcShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#2a1060" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="17"
        fill="url(#qdcBadge)" stroke="#cfc9f7" stroke-width="1.5"
        filter="url(#qdcShadow)"/>

  <g fill="none" stroke="url(#qdcInk)" stroke-width="5" stroke-linecap="round">
    <circle cx="23.5" cy="23.5" r="7"/>
    <circle cx="40.5" cy="40.5" r="7"/>
    <line x1="43" y1="21" x2="21" y2="43"/>
  </g>
</svg>
